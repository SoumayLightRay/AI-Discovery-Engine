name: Weekly Pulse Data Ingestion

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests google-play-scraper youtube-comment-downloader python-dotenv apify-client
        
    - name: Run Phase 1 Ingestion
      env:
        APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      run: python src/phase_01/ingestion.py
      
    - name: Commit and push normalized data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/phases/phase-01/normalized_data.json
        git commit -m "chore: Weekly update of normalized reviews" -a || echo "No changes to commit"
        git push
