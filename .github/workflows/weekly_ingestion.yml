name: Full Pipeline — Ingest + Analyze + Deploy

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Manual trigger from GitHub UI
  push:
    branches: [master]
    paths:
      - 'src/phase_03/web/**'
      - 'src/phase_01/**'
      - 'src/phase_02/**'

jobs:
  # ─── Phase 1: Ingest New Reviews ───
  ingest:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Phase 1 Ingestion
      env:
        APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      run: python src/phase_01/ingestion.py
      
    - name: Commit updated data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/phases/phase-01/normalized_data.json
        git diff --cached --quiet || git commit -m "chore(auto): weekly review ingestion update"
        git push

  # ─── Phase 2: Analyze with LLM ───
  analyze:
    runs-on: ubuntu-latest
    needs: ingest
    if: always() && (needs.ingest.result == 'success' || github.event_name == 'workflow_dispatch')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: master  # Get latest after ingest commit
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Phase 2 Analysis
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python src/phase_02/analysis.py
      
    - name: Copy results to web data
      run: |
        cp docs/phases/phase-02/analysis_results.json src/phase_03/web/data/analysis_results.json
        
    - name: Re-export HTML report
      run: python src/phase_03/export_report.py || echo "Report export skipped"
        
    - name: Commit analysis results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git diff --cached --quiet || git commit -m "chore(auto): weekly friction analysis update"
        git push
